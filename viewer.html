<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook Viewer</title><link rel="stylesheet" href="style.css"><style>body.viewer{background:#181715;color:#f5f2ec;overflow:hidden}.viewer header{background:#181715;border-color:#34322e}.viewer header a,.viewer .brand{color:#f5f2ec}.top{height:calc(100vh - 76px);display:flex;flex-direction:column}.bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #34322e}.bar button{background:#292723;color:#fff;border:1px solid #444039;border-radius:999px;padding:9px 14px;cursor:pointer}.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:20px 70px}.stage iframe{width:min(100%,1100px);height:100%;border:0;background:#fff;border-radius:8px;box-shadow:0 20px 70px #0008}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid #444039;background:#292723;color:white;font-size:24px;cursor:pointer}.prev{left:18px}.next{right:18px}.hint{text-align:center;font-size:12px;color:#928c84;padding:9px}.missing{max-width:600px;text-align:center;color:#b8b1a8;line-height:1.7}.missing code{color:#fff}.viewer:fullscreen .top{height:100vh}@media(max-width:650px){.stage{padding:10px 10px 25px}.stage iframe{width:100%}.arrow{bottom:5px;top:auto;transform:none}.prev{left:20px}.next{right:20px}}
</style></head><body class="viewer"><header><div class="brand">NOTEBOOKS</div><nav><a href="index.html">← Collections</a></nav></header><div class="top"><div class="bar"><strong id="title">Collection</strong><div><button id="fullscreen">Fullscreen</button></div></div><div class="stage"><button class="arrow prev" aria-label="Previous">‹</button><iframe id="pdf" title="PDF viewer"></iframe><button class="arrow next" aria-label="Next">›</button><div id="missing" class="missing" hidden>Place the PDF at <code id="path"></code> and open this collection again.</div></div><div class="hint">Use your browser's PDF controls for zoom. On desktop, ← and → can be used to navigate the PDF viewer.</div></div><script>const q=new URLSearchParams(location.search);const pdf=q.get('pdf');document.querySelector('#title').textContent=q.get('title')||'Collection';const frame=document.querySelector('#pdf');const missing=document.querySelector('#missing');if(pdf){frame.src=pdf;document.querySelector('#path').textContent=pdf;frame.onerror=()=>{frame.hidden=true;missing.hidden=false}}document.querySelector('#fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.querySelector('.prev').onclick=()=>window.history.back();document.querySelector('.next').onclick=()=>window.history.forward();document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')history.back();if(e.key==='ArrowRight')history.forward();});</script></body></html>
